name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest -q

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean build/huifu.spec

      - name: Smoke test packaged application
        run: dist\HuifuAI\HuifuAI.exe --self-test

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist\HuifuAI\* -DestinationPath HuifuAI-${{ github.ref_name }}-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuifuAI-windows-x64
          path: HuifuAI-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
